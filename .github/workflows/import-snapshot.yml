name: Import snapshot

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Direct URL of git-archive tar.gz
        required: true
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace tree with snapshot
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          set -eu
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 "$ARCHIVE_URL" -o /tmp/snapshot.tar.gz
          python3 - <<'PY'
          import tarfile, os, hashlib
          p='/tmp/snapshot.tar.gz'
          print('bytes', os.path.getsize(p))
          digest=hashlib.sha256(open(p,'rb').read()).hexdigest()
          print('sha256', digest)
          assert digest == '5a10b5ef397206526b7b28ac2743df41df22a2a0162301bde6197b634cf5f2c1'
          with tarfile.open(p, 'r:gz') as tf:
              print('entries', len(tf.getnames()))
          PY
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -xzf /tmp/snapshot.tar.gz
          git config user.name "DynamicVision2026"
          git config user.email "302155737+DynamicVision2026@users.noreply.github.com"
          git add -A
          git commit -m "Release snapshot: thick teaching S1-S3, learning route P0-P2, full-grade announcements 1026, QA fixes"
          git push origin HEAD:main
